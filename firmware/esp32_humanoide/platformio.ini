; PlatformIO Core — firmware do humanoide (ESP32 + PCA9685 + MPU-6050)
; Uso (nesta pasta):
;   pio run                         compila
;   pio run --target upload         compila + grava na ESP32
;   pio device monitor              abre o monitor serial (115200 bps)
; Protocolo: cabecalho de src/main.cpp
; Codigo-fonte: src/main.cpp

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
